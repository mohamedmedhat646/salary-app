apiVersion: apps/v1
kind: Deployment
metadata:
  name: salary-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salary-app
  template:
    metadata:
      labels:
        app: salary-app
    spec:
      containers:
      - name: salary-app
        image: mohamedmedhat646/salary-app:4
        ports:
        - containerPort: 3000
